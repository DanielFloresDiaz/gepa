name: Testing

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**/*.md'
      - '**/*.toml'
      - '**/*.lock'
      - '**/*.json'
      - '**/*.txt'
      - '**/*.env'
      - 'Makefile'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**/*.md'
      - '**/*.toml'
      - '**/*.lock'
      - '**/*.json'
      - '**/*.txt'
      - '**/*.env'
      - 'Makefile'
      - 'LICENSE'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup uv package manager
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --group lint

      - uses: pre-commit/action@v3.0.0
        with:
          extra_args: --all-files --verbose
        env:
          SKIP: no-commit-to-branch

      - name: Build package
        run: uv build

      - name: List built packages
        run: ls -lh dist/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup uv package manager
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --group lint

      - name: Run type checking
        run: make typecheck

  test:
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') && (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' || github.event_name == 'workflow_call') }}
    needs: [lint, typecheck]
    name: test on ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup uv package manager
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --group lint --python ${{ matrix.python-version }}

      - name: Create coverage directory
        run: mkdir coverage

      - name: Run tests
        run: make test
        env:
          COVERAGE_FILE: coverage/.coverage.${{ runner.os }}-py${{ matrix.python-version }}

      - name: Upload logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs-${{ matrix.python-version }}
          path: "logs/**/*.log"
          retention-days: 7

      - name: Store coverage files
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage
          include-hidden-files: true
          retention-days: 1

  coverage:
    runs-on: ubuntu-latest
    needs: [test]
    env:
      COVERAGE_THRESHOLD: 70
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get coverage files
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: coverage

      - name: Setup uv package manager
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install development dependencies
        run: uv sync --extra dev --frozen

      - name: Combine coverage files
        run: uv run --no-sync coverage combine coverage/.coverage.*

      - name: Generate HTML coverage report
        run: uv run --no-sync coverage html --show-contexts --title "Coverage for ${{ github.sha }}"

      - name: Generate XML coverage report
        run: uv run --no-sync coverage xml

      - name: Generate diff coverage report
        run: uv run --no-sync diff-cover coverage.xml --html-report index.html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Store coverage html
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov
          include-hidden-files: true
          retention-days: 7

      - name: Store diff coverage html
        uses: actions/upload-artifact@v4
        with:
          name: diff-coverage-html
          path: index.html
          include-hidden-files: true
          retention-days: 7

      - name: Store coverage xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          include-hidden-files: true
          retention-days: 7

      - name: Check coverage threshold
        run: uv run --no-sync coverage report --fail-under ${{ env.COVERAGE_THRESHOLD }}

      - name: Check diff coverage
        run: uv run --no-sync diff-cover coverage.xml

  check:
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') }}
    needs: [test, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  check-skip:
    if: ${{ contains(github.event.head_commit.message, '[skip test]') }}
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Skip tests
        run: echo "Tests skipped but proceeding with workflow"
