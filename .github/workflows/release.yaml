name: Release

on:
  push:
    tags:
      - '*'
    paths-ignore:
      - '**/*.md'
      - '**/*.toml'
      - '**/*.lock'
      - '**/*.json'
      - '**/*.txt'
      - '**/*.env'
      - 'Makefile'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testing:
    uses: ./.github/workflows/testing.yaml
    secrets: inherit

  release:
    needs: [testing]
    if: |
      always() &&
      (needs.testing.result == 'success') &&
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract version from Git tag
        id: tag_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=$TAG
          if [[ $TAG == dev* ]]; then
            IS_DEV_TAG="true"
            VERSION="dev"
          else
            IS_DEV_TAG="false"
            VERSION=$TAG
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_dev_tag=$IS_DEV_TAG" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION from tag $TAG (dev tag: $IS_DEV_TAG)"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check GITHUB_REF matches package version
        if: steps.tag_version.outputs.is_dev_tag != 'true'
        uses: samuelcolvin/check-python-version@v4.1
        with:
          version_file_path: pyproject.toml

      - name: Build package
        run: uv build

      - name: Create release
        if: steps.tag_version.outputs.is_dev_tag != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: changelogs/${{ steps.tag_version.outputs.version }}.md
          draft: false
          prerelease: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest release
        if: steps.tag_version.outputs.is_dev_tag != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
          tag_name: latest
          name: latest
          body_path: changelogs/${{ steps.tag_version.outputs.version }}.md
          draft: false
          prerelease: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
