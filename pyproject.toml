[build-system]
requires = ["setuptools>=77.0.1", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
# Do not add spaces around the '=' sign for any of the fields
# preceded by a marker comment as it affects the publish workflow.
#replace_package_name_marker
name="gepa"
#replace_package_version_marker
version="0.1.1"
description = "A framework for optimizing textual system components (AI prompts, code snippets, etc.) using LLM-based reflection and Pareto-efficient evolutionary search."
readme = "README.md"
authors = [
  { name = "Lakshya A Agrawal", email = "lakshyaaagrawal@berkeley.edu" }
]
license = { text = "MIT" }
requires-python = ">=3.10, <3.15"

dependencies = [
    "typing_extensions>=4.4.0",
]

[project.optional-dependencies]
full = [
    # Common dependencies (all Python versions)
    "litellm>=1.83.0",
    "tqdm>=4.66.1",
    "cloudpickle>=3.0.0",
    # Python < 3.14
    "datasets>=2.14.6; python_version < '3.14'",
    "mlflow>=3.11.1; python_version < '3.14'",
    "wandb; python_version < '3.14'",
    # Python 3.14+ (higher floors / alternative packages needed for compatibility)
    "datasets>=4.5.0; python_version >= '3.14'",
    "pandas>=2.3.3; python_version >= '3.14'",
    "mlflow-skinny>=3.11.1; python_version >= '3.14'",
    "wandb>=0.23.0; python_version >= '3.14'",
    "pyarrow>=22.0.0; python_version >= '3.14'",
    "pydantic>=2.12.0; python_version >= '3.14'",
    "tiktoken>=0.12.0; python_version >= '3.14'",
]
confidence = [
    "llm-structured-confidence>=0.4.5",
    "litellm>=1.64.0; python_version < '3.14'",
    "litellm>=1.81.0; python_version >= '3.14'",
]
dspy = []
test = [
    "gepa[full]",
    "pytest",
    "pyright"
]
build = [
    "setuptools>=77.0.1",
    "wheel",
    "build",
    "twine",
    "semver",
    "packaging",
    "requests>=2.33.0"
]
dev = [
    "gepa[test]",
    "gepa[build]",
    "pre-commit",
    "build>=1.0.3",
    "ruff>=0.3.0",
    "coverage>=7.6.0",
    "diff-cover>=9.2.0",
]
gskill = [
    "gepa[full]",
    "swesmith",
    "docker",
    "python-dotenv",
    "pyyaml",
]

[project.urls]
"Homepage" = "https://github.com/gepa-ai/gepa"
"Bug Tracker" = "https://github.com/gepa-ai/gepa/issues"

[dependency-groups]
lint = [
    "pre-commit>=4.5.0",
    "pyright>=1.1.388",
    "ruff>=0.6.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gepa = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast unit tests with no external dependencies",
    "integration: tests that exercise multiple components together",
    "slow: tests that take a long time to run",
    "requires_llm: tests that require an LLM API or local model",
    "llm_call: tests that make real LLM API calls",
]

[tool.coverage.run]
source = ["src/gepa"]
omit = [
    "*/__init__.py",
    "src/gepa/adapters/dspy_adapter/*",
    "src/gepa/adapters/dspy_full_program_adapter/*",
    "src/gepa/adapters/generic_rag_adapter/*",
    "src/gepa/adapters/anymaths_adapter/*",
    "src/gepa/adapters/terminal_bench_adapter/*",
    "src/gepa/adapters/confidence_adapter/*",
    "src/gepa/examples/*",
    "src/gepa/gskill/*",
]

[tool.coverage.report]
skip_covered = true
show_missing = true
ignore_errors = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "@abstractmethod",
]

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py"]
line-length = 120
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF", # ruff-specific rules
    "Q",   # flake8-quotes
]
ignore = [
    "B027",  # Allow non-abstract empty methods in abstract base classes
    "FBT003",# Allow boolean positional values in function calls
    "C901",  # Ignore complexity checking
    "E501",  # Ignore line length errors (handled by formatter)
    "UP035", # Allow python typing modules
    "RUF005", # Allow using + operator to concatenate collections
    "B904", # Allow raise custom exceptions in except blocks
    "F403", # Allow wildcard imports
    "E721", # Allow using == to compare with type
    "UP031", # Allow percent format
    "RUF022", # Allow unsorted __all__ value
    "E731"
]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
docstring-code-format = false
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["gepa"]
known-third-party = ["dspy"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Allow assert statements in tests
    "TID252",  # Allow relative imports in tests
    "ARG001",  # Allow unused arguments in tests (like pytest fixtures)
    "F401",    # Import availability checks in tests
    "F841",    # Unused variables in tests
    "B011",    # assert False in import tests
    "E402",    # Imports after setup in tests
    "E712",    # Explicit bool comparisons in tests
    "N802",    # Non-lowercase test function names
    "N806",    # Uppercase variables in tests
    "UP038",   # isinstance tuple style in tests
    "RUF013",  # Implicit Optional in test mocks
    "RUF024",  # dict.fromkeys with mutable values in tests
    "C414",    # sorted(list(...)) in tests
]
"src/gepa/api.py" = ["E402"]  # _UNSET sentinel before imports
"__init__.py" = ["F401"]  # Init files can be empty
"src/gepa/gskill/**/*.py" = ["E402"]  # gskill suppresses logging before imports
"examples/**/*.py" = ["E402"]  # Jupyter-notebook-style scripts import mid-file
