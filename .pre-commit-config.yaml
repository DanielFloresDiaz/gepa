repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: no-commit-to-branch # prevent direct commits to the `main` branch
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-toml
      - id: end-of-file-fixer
        exclude: '(llm_cache\.json|optimized_prompt.*\.txt)$'
      - id: trailing-whitespace
        exclude: '(llm_cache\.json|optimized_prompt.*\.txt)$'

  - repo: https://github.com/sirosen/texthooks
    rev: 0.6.8
    hooks:
      - id: fix-smartquotes
        exclude: '(llm_cache\.json|optimized_prompt.*\.txt)$'
      - id: fix-spaces
        exclude: '(llm_cache\.json|optimized_prompt.*\.txt)$'
      - id: fix-ligatures
        exclude: '(llm_cache\.json|optimized_prompt.*\.txt)$'

  - repo: local
    hooks:
      - id: format
        name: Format
        entry: make
        args: [format]
        language: system
        types: [python]
        pass_filenames: false
      - id: lint
        name: Lint
        entry: make
        args: [lint]
        types: [python]
        language: system
        pass_filenames: false
      # - id: typecheck
      #   name: Typecheck
      #   entry: make
      #   args: [typecheck]
      #   language: system
      #   types: [python]
      #   pass_filenames: false
